{% extends "base.html" %}
{% block title %}Login - FindIt{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="/static/css/auth.css">{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Login to FindIt</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div id="login-error" class="error-message"></div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-redirect">Don't have an account? <a href="/register">Register here</a></p>
    </div>
</div>
{% endblock %}
